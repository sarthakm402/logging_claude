receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

  otlp_http/logs:
    endpoint: http://host.docker.internal:8000

  otlp_http/metrics:
    endpoint: http://host.docker.internal:8000

  file/logs:
    path: /var/log/otel/logs.json

  file/metrics:
    path: /var/log/otel/metrics.json

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug, otlp_http/logs, file/logs]

    metrics:
      receivers: [otlp]
      exporters: [debug, otlp_http/metrics, file/metrics]